name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test-build:
    name: Lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: pushkaralu
          POSTGRES_PASSWORD: pushkaralu_dev_pw
          POSTGRES_DB: pushkaralu
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pushkaralu -d pushkaralu"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://pushkaralu:pushkaralu_dev_pw@localhost:5432/pushkaralu
      DATA_ENCRYPTION_KEY: ZGV2LW9ubHktMzItYnl0ZS1rZXktcGxhY2Vob2xkZXItMDE=
      API_PORT: 3000
      SMS_PROVIDER: mock

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Test (unit + PostGIS integration)
        run: pnpm test
