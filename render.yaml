# Render Blueprint: API + PostGIS Postgres for Pushkaralu Reunite
# https://render.com/docs/blueprint-spec

databases:
  - name: pushkaralu-db
    plan: free
    databaseName: pushkaralu
    user: pushkaralu
    postgresMajorVersion: '16'

services:
  - type: web
    name: pushkaralu-api
    runtime: node
    plan: free
    region: singapore
    rootDir: .
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @pushkaralu/shared build && pnpm --filter @pushkaralu/api build
    startCommand: pnpm --filter @pushkaralu/api exec node dist/database/migrator.js latest && pnpm --filter @pushkaralu/api start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SMS_PROVIDER
        value: mock
      - key: DATABASE_URL
        fromDatabase:
          name: pushkaralu-db
          property: connectionString
      - key: DATA_ENCRYPTION_KEY
        generateValue: true
      - key: HASH_PEPPER
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_OFFICER_PASSWORD
        generateValue: true
