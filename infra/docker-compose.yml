name: pushkaralu-reunite

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: pushkaralu-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pushkaralu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pushkaralu_dev_pw}
      POSTGRES_DB: ${POSTGRES_DB:-pushkaralu}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-pushkaralu} -d ${POSTGRES_DB:-pushkaralu}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: pushkaralu-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: pushkaralu-minio
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-pushkaralu}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-pushkaralu_dev_pw}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: create the photos bucket (private; access is via signed URLs only).
  minio-setup:
    image: minio/mc:latest
    container_name: pushkaralu-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-pushkaralu} ${S3_SECRET_KEY:-pushkaralu_dev_pw} &&
      mc mb --ignore-existing local/${S3_BUCKET:-pushkaralu-photos} &&
      mc anonymous set none local/${S3_BUCKET:-pushkaralu-photos} &&
      echo 'MinIO bucket ready: ${S3_BUCKET:-pushkaralu-photos}'
      "
    restart: 'no'

  adminer:
    image: adminer:latest
    container_name: pushkaralu-adminer
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '8080:8080'
    environment:
      ADMINER_DEFAULT_SERVER: db

volumes:
  db_data:
  redis_data:
  minio_data:
